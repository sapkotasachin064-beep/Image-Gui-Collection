name: Build src projects (Release, x64)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'images/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-src-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.scan.outputs.projects }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - uses: actions/checkout@v6

      - name: Scan src/ for projects
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          count=${#dirs[@]}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo 'projects=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One matrix entry per project: name is the folder, tag is the release tag.
          all=$(printf '%s\n' "${dirs[@]}" | jq -R -s 'split("\n") | map(select(length > 0))')
          projects=$(jq -cn --argjson a "$all" '
            $a | map({ name: ., tag: (gsub("[^A-Za-z0-9._-]"; "_")) })')
          {
            echo "projects<<PROJECTS_EOF"
            echo "$projects"
            echo "PROJECTS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "found $count projects, one build job each"

  # One job per project. A project that does not compile warns instead of failing the
  # run, so the other projects still get their release.
  build:
    name: build ${{ matrix.entry.name }}
    needs: discover
    if: ${{ needs.discover.outputs.projects != '' && needs.discover.outputs.projects != '[]' }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v2

      - name: Stage the D3DX SDK
        shell: pwsh
        run: '& ./.github/scripts/install-d3dx9.ps1 -Platform x64'

      - name: Build ${{ matrix.entry.name }} (Release|x64)
        id: build
        shell: pwsh
        env:
          PROJECT: ${{ matrix.entry.name }}
        run: '& ./.github/scripts/build-projects.ps1 -Projects @($env:PROJECT)'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.entry.tag }}
          path: |
            artifacts/
            !artifacts/**/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Release ${{ matrix.entry.name }} (tag ${{ matrix.entry.tag }})
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build.outputs.binary == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.entry.tag }}
          RELEASE_TITLE: ${{ matrix.entry.name }}
        run: '& ./.github/scripts/publish-exes.ps1 -Tag $env:RELEASE_TAG -Title $env:RELEASE_TITLE'
