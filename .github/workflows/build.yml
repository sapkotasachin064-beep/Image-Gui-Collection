name: Build src projects (Release, x64)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'images/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-src-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.scan.outputs.chunks }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - uses: actions/checkout@v6

      - name: Scan src/ for projects
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          count=${#dirs[@]}
          per=9
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo 'chunks=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          all=$(printf '%s\n' "${dirs[@]}" | jq -R -s 'split("\n") | map(select(length > 0))')
          chunks=$(jq -cn --argjson a "$all" --argjson per "$per" '
            ($a | length) as $len |
            [ range(0; (($len + $per - 1) / $per | floor)) as $i
              | { index: $i, projects: $a[($i * $per):(($i + 1) * $per)] } ]')
          {
            echo "chunks<<CHUNKS_EOF"
            echo "$chunks"
            echo "CHUNKS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "found $count projects in $(jq -c 'length' <<< "$chunks") parts"

  build:
    name: build part ${{ matrix.chunk.index }}
    needs: discover
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.discover.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v2

      - name: Stage the D3DX SDK
        shell: pwsh
        run: '& ./.github/scripts/install-d3dx9.ps1 -Platform x64'

      - name: Build the projects of this part (Release|x64)
        shell: pwsh
        env:
          PROJECTS: ${{ toJSON(matrix.chunk.projects) }}
        run: '& ./.github/scripts/build-projects.ps1 -Projects ($env:PROJECTS | ConvertFrom-Json)'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exes-part-${{ matrix.chunk.index }}
          path: |
            artifacts/
            !artifacts/**/build.log
          if-no-files-found: warn

  release:
    name: release (binaries)
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish the built binaries to the rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& ./.github/scripts/publish-exes.ps1'
